{% macro nav(active) %}
<div class="side-nav">
  <a class="{% if active == 'overview' %}active{% endif %}" href="{{ url_for('account.overview') }}">
    <svg viewBox="0 0 24 24"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"></path></svg>
    Overview
  </a>
  <a class="{% if active == 'profile' %}active{% endif %}" href="{{ url_for('account.profile') }}">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"></circle><path d="M5.5 21a8.5 8.5 0 0 1 13 0"></path></svg>
    Profile
  </a>
  <a class="{% if active == 'addresses' %}active{% endif %}" href="{{ url_for('account.addresses') }}">
    <svg viewBox="0 0 24 24"><path d="M21 10c0 6-9 13-9 13s-9-7-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
    Addresses
  </a>
  <a class="{% if active == 'security' %}active{% endif %}" href="{{ url_for('account.security') }}">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    Security
  </a>
  <a class="{% if active == 'activity' %}active{% endif %}" href="{{ url_for('account.activity') }}">
    <svg viewBox="0 0 24 24"><path d="M3 3v18h18"></path><polyline points="7 15 11 9 15 13 21 5"></polyline></svg>
    Activity
  </a>
  <a href="{{ url_for('cart.orders') }}">
    <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line></svg>
    Orders
  </a>
  <a href="{{ url_for('catalog.wishlist') }}">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
    Wishlist
    {% if wish_count %}<span class="badge">{{ wish_count }}</span>{% endif %}
  </a>
  {% if current_user.is_admin %}
  <a href="{{ url_for('admin.dashboard') }}">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
    Admin console
  </a>
  {% endif %}
</div>
{% endmacro %}
