{% extends "base.html" %}
{% block title %}Access denied — Indian Store{% endblock %}

{% block content %}
<div class="empty" style="padding-top:80px">
  <div class="ico">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
  </div>
  <h3>403 &mdash; clearance required</h3>
  <p>Your account doesn't have permission to open this part of the system.</p>
  {% if current_user %}
    <a class="btn-primary" href="{{ url_for('account.overview') }}">Back to my account</a>
  {% else %}
    <a class="btn-primary" href="{{ url_for('auth.login', next=request.full_path) }}">Sign in</a>
  {% endif %}
</div>
{% endblock %}
